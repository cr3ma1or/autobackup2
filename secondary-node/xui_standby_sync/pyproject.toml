[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xui-standby-sync"
version = "2.0.0"
description = "Transactional standby synchronization engine for 3x-ui"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "DevOps Team" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[project.scripts]
xui-standby = "xui_standby_sync.cli:main"
xui-standby-sync = "xui_standby_sync.cli:legacy_main"

[tool.setuptools]
package-dir = {"xui_standby_sync" = "."}

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["xui_standby_sync"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
disallow_any_generics = true

# Test suite is maintained alongside strict production typing. Keep the
# runtime code strictly typed, while allowing pragmatic untyped test helpers.
[[tool.mypy.overrides]]
module = "xui_standby_sync.tests.*"
disable_error_code = [
  "arg-type",
  "attr-defined",
  "import-not-found",
  "import-untyped",
  "misc",
  "no-any-return",
  "no-untyped-call",
  "no-untyped-def",
  "type-arg",
  "untyped-decorator",
  "var-annotated",
]
check_untyped_defs = false
disallow_untyped_defs = false